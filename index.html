<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#176b87" />
    <meta name="description" content="以香港2020生長參考記錄兒童身長及身高變化。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>成長曲線 · HK2020</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">家庭成長記錄</p>
          <h1>成長曲線 <span>HK2020</span></h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="export-button" type="button" title="匯出備份" aria-label="匯出備份">↓</button>
          <button class="icon-button" id="import-button" type="button" title="匯入備份" aria-label="匯入備份">↑</button>
          <input id="import-input" type="file" accept="application/json" hidden />
        </div>
      </header>

      <section class="profile-switcher" aria-label="選擇孩子">
        <button class="profile-tab active" type="button" data-profile="kaka">卡卡<span>男孩</span></button>
        <button class="profile-tab" type="button" data-profile="yuyu">榆榆<span>女孩</span></button>
      </section>
      <p class="profile-meta" id="profile-meta"></p>

      <section class="control-row" aria-label="圖表設定">
        <label class="reference-control">參考標準
          <select id="reference-select">
            <option value="HK2020">HK2020 香港參考</option>
          </select>
        </label>
        <div class="range-switcher" role="group" aria-label="圖表年齡範圍">
          <button type="button" data-range="24">0–2歲</button>
          <button type="button" data-range="60">0–5歲</button>
          <button class="active" type="button" data-range="216">0–18歲</button>
        </div>
      </section>

      <section class="summary-grid" aria-label="最新記錄摘要">
        <article class="summary-card highlight">
          <p>最新身高／身長</p>
          <strong id="latest-height">—</strong>
          <span id="latest-age">—</span>
        </article>
        <article class="summary-card">
          <p>目前百分位</p>
          <strong id="latest-percentile">—</strong>
          <span id="latest-zscore">—</span>
        </article>
        <article class="summary-card">
          <p>18歲同百分位參考</p>
          <strong id="adult-reference">—</strong>
          <span>不是醫療預測</span>
        </article>
      </section>

      <section class="chart-card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">身長／身高</p>
            <h2 id="chart-title">沿目前百分位觀察</h2>
          </div>
          <span class="reference-badge" id="reference-badge">HK2020</span>
        </div>
        <div class="chart-wrap"><canvas id="growth-chart" aria-label="兒童身高生長曲線"></canvas></div>
        <div class="chart-note">
          <span class="dot actual"></span>實測記錄
          <span class="dot projected"></span>同百分位參考軌跡
          <span class="dot reference"></span>參考百分位線
        </div>
      </section>

      <section class="history-card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">量度記錄</p>
            <h2>歷史資料</h2>
          </div>
          <button class="primary-button" id="add-record-button" type="button">＋ 新增記錄</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>

      <footer class="app-footer">
        <p>資料只儲存在此裝置的瀏覽器。HK2020資料來源：香港中文大學香港生長研究。</p>
        <p><a href="https://www.cuhk.edu.hk/proj/hkgrowth/growth_charts_tc.html" target="_blank" rel="noreferrer">查看官方生長圖表</a> · 不能代替醫療評估</p>
      </footer>
    </main>

    <dialog id="record-dialog" class="record-dialog">
      <form id="record-form" method="dialog">
        <div class="section-heading">
          <div><p class="eyebrow">新增量度</p><h2>記錄身高／身長</h2></div>
          <button class="close-button" id="close-dialog" type="button" aria-label="關閉">×</button>
        </div>
        <label>量度日期<input id="record-date" name="date" type="date" required /></label>
        <p id="record-age-preview" class="age-preview" aria-live="polite"></p>
        <label>身高／身長（厘米）<input id="record-height" name="height" type="number" min="35" max="230" step="0.1" required /></label>
        <label>量度方式<select id="record-method" name="method"><option value="standing">站立身高</option><option value="recumbent">躺臥身長</option></select></label>
        <label>體重（公斤，可選）<input id="record-weight" name="weight" type="number" min="0" max="250" step="0.01" /></label>
        <label>頭圍（厘米，可選）<input id="record-head" name="headCircumference" type="number" min="20" max="80" step="0.1" /></label>
        <label>備註（可選）<textarea id="record-notes" name="notes" rows="3" maxlength="500"></textarea></label>
        <p id="form-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button class="secondary-button" id="cancel-dialog" type="button">取消</button><button class="primary-button" type="submit">儲存記錄</button></div>
      </form>
    </dialog>

    <script src="./vendor/chart.umd.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
